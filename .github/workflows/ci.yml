name: CI

on:
  push:
    branches: [main]
  pull_request:
  # "Run workflow" button on the Actions tab, for a fresh build and debug APK of any branch.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The runner image ships an Android SDK (ANDROID_HOME), so the Android modules are included here.
      - run: ./gradlew test assembleDebug --console=plain
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: radiome-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - name: Upload Settings screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-screenshots
          path: feature/transceiver/build/outputs/screenshots/*.png
          if-no-files-found: ignore
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
